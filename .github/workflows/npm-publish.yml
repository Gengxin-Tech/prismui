name: npm publish PrismUI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a dry-run pack check or publish packages.
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - publish
      tag:
        description: npm dist-tag to publish under.
        type: string
        required: true
        default: prismui-next
      build:
        description: Run package builds before publish checks.
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-prismui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Gengxin-Tech/prismui'
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
      PRISMUI_NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
      PRISMUI_RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          if [[ ! "$ref_name" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::npm release tags must use v<major>.<minor>.<patch>, for example v7.0.0."
            exit 1
          fi
          echo "PRISMUI_RELEASE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Build packages
        if: github.event_name != 'workflow_dispatch' || inputs.build
        run: npm run build --workspaces

      - name: Verify PrismUI publish plan
        shell: bash
        run: |
          args=(--tag "$PRISMUI_NPM_TAG")
          if [ -n "${PRISMUI_RELEASE_VERSION:-}" ]; then
            args+=(--version "$PRISMUI_RELEASE_VERSION")
          fi
          npm run release:prismui:verify -- "${args[@]}"

      - name: Pack dry run
        if: env.PRISMUI_RELEASE_MODE == 'dry-run'
        shell: bash
        run: |
          args=(--tag "$PRISMUI_NPM_TAG")
          if [ -n "${PRISMUI_RELEASE_VERSION:-}" ]; then
            args+=(--version "$PRISMUI_RELEASE_VERSION")
          fi
          npm run release:prismui:pack -- "${args[@]}"

      - name: Publish packages
        if: env.PRISMUI_RELEASE_MODE == 'publish'
        shell: bash
        run: |
          args=(--tag "$PRISMUI_NPM_TAG" --provenance)
          if [ -n "${PRISMUI_RELEASE_VERSION:-}" ]; then
            args+=(--version "$PRISMUI_RELEASE_VERSION")
          fi
          npm run release:prismui:publish -- "${args[@]}"
