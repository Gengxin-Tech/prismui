<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>MobileView</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />          
    <link rel="stylesheet" href="/docs/pkg/npm_201a480.css" />
    <link rel="stylesheet" href="/docs/n/prismui-framework/lib/helper_31ed455.css" />
    <style>
      .app-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
</head>

  <body>
    <div id="root" class="app-wrapper"></div>  
<script type="text/javascript" src="/docs/pkg/app_fae79a3.js"></script>
<script type="text/javascript" src="/docs/pkg/color-picker_ed409c5.js"></script>
<script src="/docs/pkg/npm_65a7944.js"></script>
<script type="text/javascript" src="/docs/pkg/examples/mobile.html_map_41217c4.js"></script>
<script type="text/javascript">
      const themes = [
        {
          label: '云舍',
          value: 'cxd'
        },
        {
          label: 'Ang',
          value: 'ang'
        },
        {
          label: 'Dark',
          value: 'dark'
        },
        {
          label: 'antd',
          value: 'antd'
        }
      ];
      // mobile 下先禁掉所有外链避免影响
      document.querySelectorAll('link[title]').forEach(item => {
        item.disabled = true;
      });
      let theme = localStorage.getItem('amis-theme') || 'cxd';
      if (theme == 'default') {
        theme = 'cxd';
      }

      const linkDom = document.querySelector(`link[title=${theme}]`);

      if (linkDom) {
        linkDom.disabled = false;
      }

      if (theme === 'dark') {
        document.querySelector('body').classList.add('dark');
      }

      document.querySelector('body').setAttribute('data-prismui-theme', theme);

      amis.require(['5cd8f64'], function (app) {
        app.bootstrap(document.getElementById('root'), {});
      });
    </script>
</body>
</html>
